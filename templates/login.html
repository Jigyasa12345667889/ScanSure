<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanSure | Fake Product Detector</title>
    
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --accent: #34d399;
            --dark: #0f172a;
            --muted: #64748b;
            --border: #cbd5e1;
            --border-focus: #10b981;
            --bg-gradient: radial-gradient(circle at 10% 20%, rgb(6, 95, 70) 0%, rgb(2, 44, 34) 90%);
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(16, 185, 129, 0.15);
            filter: blur(80px);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            z-index: 0;
        }

        /* =========================================
           LOGIN CARD CONTAINER
        ========================================= */
        .login-card {
            width: min(1080px, 100%);
            min-height: 620px;
            background: #ffffff;
            display: grid;
            grid-template-columns: 42% 58%;
            overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(2, 44, 34, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        /* =========================================
           LEFT SIDE - BRAND SIDE
        ========================================= */
        .brand-side {
            background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px;
            position: relative;
            overflow: hidden;
            color: white;
        }

        .brand-side::before {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.045);
            top: -150px;
            left: -140px;
        }

        .brand-side::after {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.035);
            bottom: -130px;
            right: -90px;
        }

        .brand-content {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        /* Original Logo Styling Restored */
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            color: #4ade80;
            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.18));
        }

        .logo svg {
            width: 100%;
            height: 100%;
        }

        .brand-title {
            color: white;
            font-size: 40px;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand-title span {
            display: block;
            color: #86efac;
            font-size: 20px;
            font-weight: 650;
            margin-top: 8px;
            letter-spacing: 0;
        }

        .tagline {
            margin-top: 16px;
            color: #d1fae5;
            font-size: 17px;
            letter-spacing: 0.3px;
        }

        /* =========================================
           RIGHT SIDE - FORM SIDE
        ========================================= */
        .form-side {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 60px;
        }

        .form-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .form-header {
            margin-bottom: 30px;
        }

        .form-header h1 {
            font-size: 28px;
            color: var(--dark);
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .form-header p {
            color: var(--muted);
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        .input-box {
            height: 52px;
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            background: #f8fafc;
            transition: all 0.2s ease;
        }

        .input-box:focus-within {
            border-color: var(--border-focus);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
        }

        .input-icon {
            width: 46px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
        }

        .input-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .input-box input {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            font-size: 15px;
            color: var(--dark);
            background: transparent;
            padding-right: 12px;
        }

        .input-box input::placeholder {
            color: #94a3b8;
        }

        .password-toggle {
            width: 46px;
            height: 100%;
            border: none;
            background: transparent;
            cursor: pointer;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0 24px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            cursor: pointer;
            user-select: none;
        }

        .remember input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
            border-radius: 4px;
        }

        .forgot {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .forgot:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
            transition: all 0.25s ease;
        }

        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(5, 150, 105, 0.35);
        }

        .login-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.2s;
        }

        .login-btn:hover svg {
            transform: translateX(4px);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
        }

        .divider span {
            height: 1px;
            background: #e2e8f0;
            flex: 1;
        }

        .divider p {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
        }

        .signup {
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .signup a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            text-align: center;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        @media (max-width: 900px) {
            .login-card {
                grid-template-columns: 1fr;
                max-width: 480px;
            }

            .brand-side {
                min-height: 280px;
                padding: 35px 30px;
            }

            .form-side {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- LEFT BRAND SECTION (Original Logo & Name Preserved) -->
        <section class="brand-side">
            <div class="brand-content">
                <div class="logo">
                    <svg viewBox="0 0 100 100">
                        <path d="M50 7 L82 19 V43 C82 65 69 82 50 92 C31 82 18 65 18 43 V19 Z" fill="none" stroke="currentColor" stroke-width="6"/>
                        <path d="M35 48 L46 59 L67 36" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

                <h2 class="brand-title">
                    ScanSure
                    <span>Fake Product Detector</span>
                </h2>

                <p class="tagline">Verify. Trust. Stay Safe.</p>
            </div>
        </section>

        <!-- RIGHT LOGIN SECTION -->
        <section class="form-side">
            <div class="form-wrapper">
                <div class="form-header">
                    <h1>Welcome Back!</h1>
                    <p>Login to continue to your account</p>
                </div>

                <form id="loginForm" method="POST" action="/login">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-box">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24">
                                    <rect x="3" y="5" width="18" height="14" rx="2" />
                                    <path d="M3 7l9 6 9-6" />
                                </svg>
                            </span>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-box">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24">
                                    <rect x="5" y="10" width="14" height="10" rx="2" />
                                    <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                                    <circle cx="12" cy="15" r="1" />
                                </svg>
                            </span>
                            <input type="password" id="password" name="password" placeholder="Enter your password" required>
                            
                            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                                <svg id="eyeIcon" viewBox="0 0 24 24">
                                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="options">
                        <label class="remember">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">
                        Login
                        <svg viewBox="0 0 24 24">
                            <path d="M5 12h14" />
                            <path d="m13 6 6 6-6 6" />
                        </svg>
                    </button>
                </form>

                <div class="divider">
                    <span></span>
                    <p>or</p>
                    <span></span>
                </div>

                <p class="signup">
                    Don't have an account?
                    <a href="/register">Sign up</a>
                </p>
            </div>
        </section>
    </div>

    <footer>
        © 2026 ScanSure. All rights reserved.
    </footer>

    <script>
        const password = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");

        togglePassword.addEventListener("click", function () {
            if (password.type === "password") {
                password.type = "text";
                eyeIcon.innerHTML = `
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                    <line x1="2" y1="2" x2="22" y2="22" />
                `;
            } else {
                password.type = "password";
                eyeIcon.innerHTML = `
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="3" />
                `;
            }
        });

        document.getElementById("loginForm").addEventListener("submit", function(event) {
            const email = document.getElementById("email").value.trim();
            const passwordValue = document.getElementById("password").value.trim();

            if (email === "" || passwordValue === "") {
                event.preventDefault();
                alert("Please enter your email and password.");
            }
        });
    </script>
</body>
</html>
